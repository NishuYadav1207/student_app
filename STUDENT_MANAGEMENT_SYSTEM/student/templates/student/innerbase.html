<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Student Core Dashboard{% endblock %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F5F3FF;
            color: #25233A;
        }

        .dashboard-layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: #211A4C;
            color: #FFFFFF;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            padding: 28px 18px;
            z-index: 100;
        }

        .sidebar-brand {
            font-size: 25px;
            font-weight: 800;
            padding: 0 14px 35px;
        }

        .sidebar-brand span {
            color: #7B6DFF;
        }

        .menu-label {
            color: #AAA5C8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 0 14px;
            margin-bottom: 12px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            border-radius: 11px;
            color: #D8D4EC;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: .3s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #4C3BCF;
            color: #FFFFFF;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 25px;
            left: 18px;
            right: 18px;
        }

        .logout {
            background: rgba(255,255,255,.08);
        }

        .main-area {
            margin-left: 260px;
            width: calc(100% - 260px);
            min-height: 100vh;
        }

        .topbar {
            height: 75px;
            background: #FFFFFF;
            border-bottom: 1px solid #E9E5FF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 800;
            color: #211A4C;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #4C3BCF;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .content {
            padding: 35px;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 75px;
                padding: 25px 10px;
            }

            .sidebar-brand {
                font-size: 0;
                text-align: center;
            }

            .sidebar-brand span {
                font-size: 22px;
            }

            .sidebar-menu a {
                justify-content: center;
                font-size: 0;
            }

            .menu-label {
                display: none;
            }

            .main-area {
                margin-left: 75px;
                width: calc(100% - 75px);
            }

            .content {
                padding: 20px;
            }

            .topbar {
                padding: 0 20px;
            }
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            Student <span>Core</span>
        </div>

        <div class="menu-label">
            MAIN MENU
        </div>

        <nav class="sidebar-menu">

            <a
                href="{% url 'dashboard' %}"
                class="active"
            >
                ◈
                Dashboard
            </a>

            <a href="{% url 'student_list' %}">
                ◉
                All Students
            </a>

            <a href="{% url 'student_create' %}">
                ＋
                Add Student
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="sidebar-menu">

                <a href="{% url 'home' %}">
                    ◀
                    Public Website
                </a>

                <a
                    href="{% url 'logout' %}"
                    class="logout"
                >
                    ⇥
                    Logout
                </a>

            </div>

        </div>

    </aside>


    <div class="main-area">

        <header class="topbar">

            <div class="topbar-title">
                Management Console
            </div>

            <div class="user-box">

                <div>
                    {{ request.user.username }}
                </div>

                <div class="user-avatar">
                    {{ request.user.username|first|upper }}
                </div>

            </div>

        </header>


        <main class="content">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

</body>

</html>
