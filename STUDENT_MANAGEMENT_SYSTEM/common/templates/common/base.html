<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Student Core{% endblock %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F5F3FF;
            color: #25233A;
        }

        .navbar {
            height: 76px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #E9E5FF;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            color: #211A4C;
            text-decoration: none;
        }

        .brand span {
            color: #4C3BCF;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #25233A;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: .3s;
        }

        .nav-links a:hover {
            color: #4C3BCF;
        }

        .login-btn {
            background: #4C3BCF;
            color: #FFFFFF !important;
            padding: 12px 22px;
            border-radius: 10px;
        }

        .login-btn:hover {
            background: #211A4C;
        }

        .page-container {
            min-height: calc(100vh - 76px);
        }

        @media (max-width: 768px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a:not(.login-btn) {
                display: none;
            }
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <nav class="navbar">

        <a href="{% url 'home' %}" class="brand">
            Student <span>Core</span>
        </a>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'about' %}">
                About
            </a>

            <a href="{% url 'faq' %}">
                FAQ
            </a>

            <a href="{% url 'contactus' %}">
                Contact
            </a>

            <a
                href="{% url 'login' %}"
                class="login-btn"
            >
                Login
            </a>

        </div>

    </nav>

    <main class="page-container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
